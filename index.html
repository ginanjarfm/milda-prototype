<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Milda Recall</title>
<link rel="icon" href="assets/logo-mark.png">
<style>
@font-face{font-family:"Plus Jakarta Sans";font-weight:400;font-style:normal;font-display:swap;src:url(assets/pjs-400.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:500;font-style:normal;font-display:swap;src:url(assets/pjs-500.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:600;font-style:normal;font-display:swap;src:url(assets/pjs-600.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:700;font-style:normal;font-display:swap;src:url(assets/pjs-700.woff2) format("woff2")}
@font-face{font-family:"Marcellus";font-weight:400;font-style:normal;font-display:swap;src:url(assets/marcellus-400.woff2) format("woff2")}

:root{
  --espresso:#2B2420;--bronze:#7A5C3A;--bronze-hover:#664C2F;--champagne:#B89878;--champagne-soft:#F1EAE1;
  --wire:#C9C9C9;--line:#E6E3DF;--porcelain:#F6F6F3;--surface:#FFFFFF;--muted:#6B625B;
  --done:#3F6B4E;--late:#9C3F2A;--scheduled:#44546A;--wa:#1F7A47;
  --ld-g:#DDEBDF;--ld-y:#F1E6CF;--ld-o:#F6C98A;--ld-r:#EDB8AB;--ld-g-t:#2D5A3D;--ld-y-t:#5E4A1E;--ld-o-t:#6B3F08;--ld-r-t:#6E2414;
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Marcellus","Trajan Pro",Georgia,serif;
  --nav-text:#E9E4DE;
  --ring:#8F6F4D;--field:#8F8780;--r-ctl:10px;--r-list:14px;--r-sheet:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:16px;line-height:1.5;color:var(--espresso);background:var(--porcelain);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.side :focus-visible,#toast :focus-visible{outline-color:var(--champagne)}
a.lr:focus-visible,.lr[role=button]:focus-visible{outline-offset:-3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:12px;top:-60px;z-index:100;background:var(--surface);color:var(--bronze);font-weight:600;padding:10px 16px;border-radius:var(--r-ctl);box-shadow:0 4px 16px rgba(43,36,32,.2)}
.skip:focus{top:12px}
body.modal-open{overflow:hidden}
main:focus{outline:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}
.sm{font-size:13px}
.only-d{display:none!important}
.only-m{display:block}
.title{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.2;margin:0;letter-spacing:0}

/* ---------- shell ---------- */
.side{display:none}
.topbar{position:sticky;top:0;z-index:20;height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.topbar img{height:28px;width:auto}
main{padding:20px 16px 104px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:64px;padding-top:4px;color:var(--muted);font-size:13px;font-weight:500}
.tabbar a.on{color:var(--bronze);font-weight:600}
.tabbar a.on::before{content:"";position:absolute;top:5px;width:8px;height:5px;border-radius:2px;background:var(--champagne)}
.tabbar .badge{position:absolute;top:8px;left:calc(50% + 4px);min-width:18px;padding:0 5px;border-radius:999px;background:var(--bronze);color:#fff;font-size:13px;line-height:18px;font-weight:700;text-align:center}

@media(min-width:960px){
  .only-d{display:block!important}.only-m{display:none!important}
  span.only-d{display:inline!important}
  .topbar,.tabbar{display:none}
  .shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
  .side{display:block;background:var(--espresso);color:var(--nav-text)}
  .side-in{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:28px 16px 20px;overflow-y:auto}
  .content{min-width:0}
  main{padding:40px 48px 72px}
  .title{font-size:28px}
}
@media(min-width:960px) and (max-width:1199px){.shell{grid-template-columns:216px minmax(0,1fr)}main{padding:32px 32px 64px}}
.side .brand{padding:0 8px 28px}
.side .brand img{width:100%;max-width:150px;height:auto}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-ctl);font-size:15px;font-weight:500;color:var(--nav-text)}
@media(hover:hover){.side nav a:hover{background:rgba(255,255,255,.05)}}
.side nav a.on{background:rgba(255,255,255,.09);color:#fff;font-weight:600}
.side nav a.on::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--champagne)}
.badge{margin-left:auto;min-width:24px;padding:0 8px;border-radius:999px;background:var(--champagne-soft);color:var(--bronze);font-size:13px;line-height:22px;font-weight:700;text-align:center}
.side .foot{margin-top:auto;padding:16px 8px 0;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:12px}
.side .foot .clinic{font-size:13px;color:#BDB3A9;line-height:1.4}
.side .foot .proto{font-size:13px;color:#A99F95}
.side .foot a{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--nav-text);padding:6px 0;width:max-content}
@media(hover:hover){.side .foot a:hover{color:#fff}}

/* ---------- page header ---------- */
.ph{display:flex;flex-direction:column;gap:4px;margin-bottom:20px}
.ph .sub{color:var(--muted);font-size:14px}
@media(min-width:960px){.ph{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}.ph .sub{font-size:16px;text-align:right}.ph .sub.l{text-align:left}}
.ph-l{display:flex;flex-direction:column;gap:6px}

/* ---------- buttons, chips, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-ctl);border:1px solid var(--bronze);background:var(--surface);color:var(--bronze);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .12s,color .12s,border-color .12s}
@media(hover:hover){.btn:hover{background:var(--champagne-soft)}}
.btn.primary{background:var(--bronze);color:#fff}
@media(hover:hover){.btn.primary:hover{background:var(--bronze-hover);border-color:var(--bronze-hover)}}
.btn:active{background:var(--champagne-soft)}.btn.primary:active{background:var(--bronze-hover)}.btn.wa:active{background:#18623a}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
@media(hover:hover){.btn.wa:hover{background:#18623a;border-color:#18623a}}
.btn.bad{border-color:var(--late);color:var(--late)}
@media(hover:hover){.btn.bad:hover{background:color-mix(in srgb,var(--late) 10%,#fff)}}
.btn.ghost{border-color:transparent;background:transparent}
@media(hover:hover){.btn.ghost:hover{background:var(--champagne-soft)}}
.btn.quiet{border-color:var(--wire);color:var(--espresso)}
@media(hover:hover){.btn.quiet:hover{border-color:var(--champagne)}}
.btn.xl{display:none}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.ic{width:40px;min-height:40px;padding:0}
.btn[disabled]{opacity:.5;cursor:default}
@media(min-width:960px){.btn{min-height:40px}.btn.sm{min-height:36px}}
.chip{display:inline-block;padding:1px 10px;border-radius:999px;font-size:13px;line-height:22px;font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--c,var(--muted)) 12%,#fff);color:var(--c,var(--muted))}
.c-done{--c:var(--done)}.c-late{--c:var(--late)}.c-sched{--c:var(--scheduled)}.c-bronze{--c:var(--bronze)}.c-muted{--c:var(--muted)}
.chip.c-bronze{background:var(--champagne-soft)}
.chip.pst::before{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;background:currentColor;margin-right:6px;vertical-align:1px}
.chip.tag{background:transparent;color:var(--bronze);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bronze) 45%,#fff)}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;min-height:36px;font-size:14px;font-weight:500;cursor:pointer;color:var(--espresso)}
@media(hover:hover){.fchip:hover{border-color:var(--champagne)}}
.fchip.on{background:var(--champagne-soft);border-color:var(--bronze);color:var(--bronze);font-weight:600}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
label.lb,.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--espresso)}
.lbl span{font-weight:400;color:var(--muted);margin-left:6px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=search],input:not([type]),select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--field);border-radius:var(--r-ctl);background:var(--surface);font-size:16px}
input::placeholder,textarea::placeholder{color:#736A63}
textarea{min-height:96px;resize:vertical;line-height:1.5}
@media(hover:hover){input:hover,select:hover,textarea:hover{border-color:var(--bronze)}}
input:focus-visible,select:focus-visible,textarea:focus-visible{border-color:var(--bronze)}
.fld{margin-bottom:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.help{font-size:14px;color:var(--late);min-height:20px;margin-top:4px}
.hint{font-size:14px;color:var(--muted);margin-top:8px}
@media(min-width:960px){input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=search],input:not([type]),select{min-height:40px;font-size:15px}}
input[aria-invalid=true]{border-color:var(--late)}

/* segmented control */
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--porcelain)}
.seg.g2{display:grid;grid-template-columns:1fr 1fr}
@media(min-width:600px){.seg.g2{display:flex}}
.seg button{flex:1 1 auto;min-height:40px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-size:14px;font-weight:500;cursor:pointer;color:var(--espresso)}
@media(hover:hover){.seg button:hover{background:rgba(0,0,0,.03)}}
.seg button.on{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--bronze);font-weight:600;color:var(--espresso)}

/* ---------- ledger ---------- */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-list);overflow:hidden;container-type:inline-size}
.lr{display:grid;grid-template-columns:var(--cols,1fr);gap:6px 20px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.ledger>.lr:first-child,.ledger>.lh:first-child{border-top:0}
.lr.out{animation:rowout .26s ease forwards}
@keyframes rowout{to{opacity:0;transform:translateX(14px)}}
.nm{font-size:16px;font-weight:600;line-height:1.35;color:var(--espresso)}
@media(hover:hover){a.nm:hover{color:var(--bronze);text-decoration:underline;text-decoration-color:var(--champagne);text-underline-offset:3px}}
.sub{font-size:14px;color:var(--muted);line-height:1.45}
.meta{display:flex;flex-wrap:wrap;align-items:center;column-gap:12px}
.meta .chip{line-height:20px}
.sect.plain{background:none;border:0;padding:0}
.st-late{color:var(--late);font-weight:600}.st-soon{color:var(--bronze);font-weight:600}.st-sched{color:var(--scheduled);font-weight:600}
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:4px}
.empty b{color:var(--espresso);font-size:16px;font-weight:600}
.empty .btn{margin-top:12px}
.empty.slim{padding:16px 20px;font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{flex:1 1 auto}
.note{font-size:14px;color:var(--muted);margin-top:2px;white-space:nowrap}

/* today row */
.tr{grid-template-columns:52px minmax(0,1fr) auto;gap:4px 12px}
.tr .c-main{display:contents}
.tr .c-name{grid-column:2;grid-row:1;min-width:0}
.tr .c-sub{grid-column:2/-1;grid-row:2}
.tr .c-note{grid-column:2/-1;grid-row:3}
.tr .c-time .sm{display:none}
.tr .c-act{margin-top:8px}
.tr .c-act .btn{flex:1 1 0}
.tr .c-time{grid-column:1;grid-row:1;display:flex;flex-direction:column;line-height:1.3}
.tr .c-time b{font-size:16px;font-weight:600}
.tr .c-chip{grid-column:3;grid-row:1;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.tr .c-type{display:none}
.tr .c-act{grid-column:1/-1;grid-row:4;display:flex;gap:8px}
.tr .c-act:empty{display:none}
.tr.is-missed .nm{color:var(--espresso)}
.tr.is-done .c-time b{color:var(--muted)}

/* recall + patient rows (phone layout) */
.rr{grid-template-columns:minmax(0,1fr) auto}
.rr .c-due{grid-column:2;grid-row:1;text-align:right}
.rr .c-iv{grid-column:1/-1}
.rr .c-act{grid-column:1/-1}
.rr .c-main .meta,.fr .c-main .meta{flex-direction:column;align-items:flex-start}
.rr .c-iv{display:none}
.pr{grid-template-columns:minmax(0,1fr) auto}
.pr .c-stat{grid-column:2;grid-row:1}
.pr .c-next{grid-column:1/-1;font-size:14px}
.pr .c-treat{display:none}
.fr{grid-template-columns:minmax(0,1fr) auto}
.fr .c-due{grid-column:2;grid-row:1;text-align:right}
.fr .c-act{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}
.fr .c-act .start{grid-column:1/-1}

/* list layouts follow the width of the list itself, not the screen:
   narrow = phone, mid = tablet or small window (actions sit under the name), wide = columns with a header row */
@container (min-width:560px){
  .lr{padding:14px 24px}
  .tr{grid-template-columns:72px minmax(0,1fr) auto}
  .tr .c-time .sm{display:block}
  .tr .c-act{grid-column:2/-1}
  .tr .c-act .btn,.rr .c-act .btn,.fr .c-act .btn{flex:0 0 auto}
  .fr .c-act{display:flex;flex-wrap:wrap}
}
@container (min-width:1000px){
  .lr{gap:6px 24px}
  .lh.lh-c{display:grid}
  .cn{display:none}
  .tr{--cols:72px minmax(0,1.3fr) minmax(0,1fr) 112px 300px;grid-template-columns:var(--cols)}
  .tr .c-time{grid-column:auto;grid-row:auto}
  .tr .c-name,.tr .c-sub,.tr .c-note,.tr .c-chip,.tr .c-act,.tr .c-type{grid-column:auto;grid-row:auto}
  .tr .c-type{display:block;font-size:15px}
  .tr .c-type .kchip{margin-top:4px}
  .tr .t-type{display:none}
  .tr .c-chip{align-items:flex-start}
  .tr .c-act{display:flex;justify-content:flex-end;gap:8px;margin-top:0}
  .tr .c-sub .kc{display:none}
  .tr .c-main{display:block}
  .rr{--cols:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.9fr) 270px;grid-template-columns:var(--cols)}
  .rr .c-due,.rr .c-iv,.rr .c-act{grid-column:auto;grid-row:auto;text-align:left}
  .rr .c-iv{display:block;font-size:15px}
  .rr .c-act{justify-content:flex-end}
  .rr .c-main .meta{flex-direction:row}
  .fr{--cols:minmax(0,1fr) minmax(0,.8fr) 470px;grid-template-columns:var(--cols)}
  .fr .c-due,.fr .c-act{grid-column:auto;grid-row:auto;text-align:left}
  .fr .c-act{display:flex;justify-content:flex-end}
  .fr .c-act .wa{width:128px}.fr .c-act .quiet{width:160px}.fr .c-act .start{width:150px}
}
.lh{display:none;grid-template-columns:var(--cols);gap:0 24px;padding:12px 24px;font-size:13px;font-weight:600;color:var(--muted)}
@media(min-width:960px){
  .lh.lh-v{display:grid}
  .ledger .pr{padding:14px 24px;gap:6px 24px}
  .pr{--cols:minmax(0,1.2fr) minmax(0,1.1fr) minmax(0,1.3fr) 108px;grid-template-columns:var(--cols)}
  .pr .c-main{grid-column:1;grid-row:1}.pr .c-treat{grid-column:2;grid-row:1}.pr .c-next{grid-column:3;grid-row:1}.pr .c-stat{grid-column:4;grid-row:1}
  .pr .c-treat{display:block}
}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tabs button{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);font-size:14px;font-weight:500;text-align:left;cursor:pointer;line-height:1.3}
.tabs button.on{background:var(--champagne-soft);border-color:var(--bronze);color:var(--bronze);font-weight:600}
.descrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-4px 0 14px;flex-wrap:wrap}
.tabdesc{color:var(--muted);font-size:14px;margin:0}
.tb-act{display:flex;gap:8px;flex-wrap:wrap}.tb-act .btn{flex:1 1 auto}
@media(min-width:600px){.tabs{grid-template-columns:repeat(4,1fr)}}
@media(min-width:960px){.btn.xl{display:inline-flex}.hide-d{display:none!important}.tb-act .btn{flex:0 0 auto}.toolbar{margin-bottom:12px}}
.pchips{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin:4px 0 12px;min-height:30px}
.pchips:not(:has(.fcs *,.sub)){display:none}
.fcs{display:flex;gap:8px;flex-wrap:wrap}
.fc{display:inline-flex;align-items:center;gap:4px;background:var(--champagne-soft);color:var(--espresso);border-radius:999px;padding:2px 4px 2px 12px;font-size:14px;line-height:24px}
.fc button{width:28px;height:28px;border:0;border-radius:999px;background:none;font-size:18px;line-height:1;cursor:pointer;color:var(--bronze)}
@media(hover:hover){.fc button:hover{background:rgba(122,92,58,.14)}}
.hc{display:flex;align-items:center;gap:2px}
.hb{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-radius:6px;text-align:left}
@media(hover:hover){.hb:hover{color:var(--espresso)}}
.hb svg.i{width:14px;height:14px;color:var(--bronze)}
.fb{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;padding:0}
.fb svg.i{width:14px;height:14px}
@media(hover:hover){.fb:hover{background:var(--champagne-soft);color:var(--bronze)}}
.fb.on{background:var(--champagne-soft);color:var(--bronze)}
.pop{position:fixed;z-index:60;width:272px;max-height:min(480px,calc(100vh - 80px));overflow-y:auto;background:var(--surface);border-radius:var(--r-list);box-shadow:0 12px 40px rgba(43,36,32,.18);padding:12px 8px 8px;animation:sheet .16s ease-out}
.pop-t{font-size:14px;font-weight:600;padding:0 8px 6px}
.afi{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 8px;border-radius:8px;font-size:15px;cursor:pointer}
@media(hover:hover){.afi:hover{background:var(--champagne-soft)}}
.afi.all{font-weight:600;border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;margin-bottom:4px}
.afi input{width:18px;height:18px;margin:0;accent-color:var(--bronze)}
.pop-f{display:flex;justify-content:space-between;gap:8px;padding:8px 4px 0;margin-top:6px;border-top:1px solid var(--line)}
.afgrid [data-afc]{display:grid;grid-template-columns:1fr 1fr}
.afgrid .afi.all{grid-column:1/-1}
.afgrid [data-afc=tx]{grid-template-columns:1fr}
.afgrid .afi{min-height:40px}
.wa-to{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.wa-to b{font-size:16px}
.wa-av{width:40px;height:40px;border-radius:999px;background:var(--champagne-soft);color:var(--bronze);display:flex;align-items:center;justify-content:center;font-weight:700}

<script>
/* ---------- date helpers (real current date) ---------- */
const pad2=n=>String(n).padStart(2,'0');
const _now=new Date();
const TODAY=`${_now.getFullYear()}-${pad2(_now.getMonth()+1)}-${pad2(_now.getDate())}`;
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const DOWS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const ID_MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const ID_DOW=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const P=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const ISO=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=P(s);d.setUTCDate(d.getUTCDate()+n);return ISO(d)};
const addMonths=(s,n)=>{const [y,m,d]=s.split('-').map(Number);const t=y*12+(m-1)+n,ny=Math.floor(t/12),nm=t%12;const last=new Date(Date.UTC(ny,nm+1,0)).getUTCDate();return ISO(new Date(Date.UTC(ny,nm,Math.min(d,last))))};
const addInterval=(s,v,u)=>u==='week'?addDays(s,7*v):addMonths(s,v);
const diff=(a,b)=>Math.round((P(a)-P(b))/864e5);
const dow=s=>P(s).getUTCDay();
const fmtId=s=>{const d=P(s);return `${ID_DOW[d.getUTCDay()]}, ${d.getUTCDate()} ${ID_MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`};
const fmt=s=>{const d=P(s);return `${DOWS[d.getUTCDay()]}, ${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`};
const fmtDM=s=>{const d=P(s);return `${DOWS[d.getUTCDay()]}, ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`};
const fmtS=s=>{const d=P(s);return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`};
const fmtSY=s=>{const d=P(s);return `${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`};
const unitId=(v,u)=>u==='week'?'minggu':'bulan';
const ivTxt=(v,u)=>`Setiap ${v} ${unitId(v,u)}`;
const ivShort=(v,u)=>`${v} ${unitId(v,u)}`;
const nextOpen=s=>{let d=addDays(s,1);while(dow(d)===0)d=addDays(d,1);return d};
const noSun=s=>dow(s)===0?addDays(s,1):s;
const weekStart=s=>addDays(s,-((dow(s)+6)%7));
const T=n=>addDays(TODAY,n);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- reference data ---------- */
const KIND={kontrol:'Kontrol',cabut:'Pencabutan',odon:'Odontektomi',hecting:'Up hecting'};
const KMIN={cabut:30,odon:60,hecting:20};
const defTypes=()=>[
 {id:'kmetal',name:'Konvensional Metal',v:4,u:'week',min:30},
 {id:'kclear',name:'Konvensional Clear',v:4,u:'week',min:30},
 {id:'dultima',name:'Damon Ultima Metal',v:6,u:'week',min:30,range:'Rentang 6 sampai 8 minggu'},
 {id:'dq2m',name:'Damon Q2 Metal',v:6,u:'week',min:30,range:'Rentang 6 sampai 8 minggu'},
 {id:'dq2c',name:'Damon Q2 Clear',v:6,u:'week',min:30,range:'Rentang 6 sampai 8 minggu'},
 {id:'ndm',name:'Non Damon Metal',v:6,u:'week',min:30,range:'Rentang 6 sampai 8 minggu'},
 {id:'ndc',name:'Non Damon Clear',v:6,u:'week',min:30,range:'Rentang 6 sampai 8 minggu'},
 {id:'rem',name:'Removable Appliance',v:2,u:'week',min:20},
 {id:'ret',name:'Retainer',v:6,u:'month',min:20,range:'Rentang 6 sampai 12 bulan, status pasien menjadi Retensi'}];
const TINDAKAN=[
 {k:'cabut',name:'Pencabutan',note:'Sekali datang, tidak ada recall'},
 {k:'odon',name:'Odontektomi',note:'Otomatis menyarankan kunjungan Up hecting setelah selesai'},
 {k:'hecting',name:'Up hecting',note:'Sekali datang, tidak ada recall'}];
const PST={konsultasi:['Konsultasi','c-bronze'],aktif:['Aktif','c-done'],retensi:['Retensi','c-sched'],selesai:['Selesai','c-muted'],batal:['Batal','c-late'],tidaklanjut:['Tidak lanjut','c-muted']};
const AST={scheduled:['Terjadwal','c-sched'],done:['Selesai','c-done'],missed:['Tidak datang','c-late'],cancelled:['Dibatalkan','c-muted']};
const chip=(c,t)=>`<span class="chip ${c}">${t}</span>`;
const pChip=p=>chip(PST[p.status][1]+' pst',PST[p.status][0]);
const aChip=a=>chip(AST[a.status][1],AST[a.status][0]);
const DEF_TPL='Halo {nama}, ini pengingat jadwal kontrol behel Anda di {klinik} pada {tanggal} pukul {jam}. Mohon konfirmasi kehadiran. Terima kasih.';
const DEF_CALL='Halo {nama}, sudah waktunya kontrol behel Anda di {klinik} (jatuh tempo {tanggal}). Silakan balas pesan ini untuk mengatur jadwal kunjungan. Terima kasih.';
const DEF_FU='Halo {nama}, terima kasih sudah berkonsultasi di {klinik}. Apakah ada yang ingin ditanyakan atau mau dijadwalkan untuk mulai perawatan? Kami siap membantu.';
const CLINIC='Milda Orthodontic Specialist';
const FU_DAYS=14,FU_MAX=3;

let TYPES=defTypes(),patients=[],guests=[],appts=[],apptN=1;
let S={clinic:CLINIC,template:DEF_TPL,callTemplate:DEF_CALL,fuTemplate:DEF_FU,hectingWeeks:1,rules:{days:[1,2,3,4,5,6],from:'09:00',to:'17:00',max:12,window:7,near:75},
  recallTab:'due',pq:'',fStatus:null,fTx:null,sort:{k:'name',d:1},af:null,calMode:'week',calWeek:weekStart(TODAY),calMonth:TODAY.slice(0,8)+'01',calOpen:{}};
const tx=id=>TYPES.find(t=>t.id===id);
const hhmm=t=>pad2(Math.floor(t/60))+':'+pad2(t%60);
function slotList(){const [h1,m1]=S.rules.from.split(':').map(Number),[h2,m2]=S.rules.to.split(':').map(Number),o=[];for(let t=h1*60+m1;t<h2*60+m2;t+=30){if(t>=720&&t<780)continue;o.push(hhmm(t))}return o}
const ORDER=['09:00','09:30','11:00','13:00','14:00','15:00','11:30','13:30','16:00','14:30','15:30','10:30','16:30','10:00'];
/* closed days (from Pengaturan) are skipped: next working day on or after s */
const openDay=s=>{const d=S.rules.days;if(!d.length)return s;while(!d.includes(dow(s)))s=addDays(s,1);return s};

/* ---------- dummy data, relative to the real current date ---------- */
const SPEC=[
 {n:'Siti Rahmawati',ph:'0812-3456-7801',tx:'dultima',st:'aktif',slot:'10:00',cnt:5,last:-42,step:42,today:['10:00','scheduled']},
 {n:'Budi Santoso',ph:'0813-2211-4590',tx:'kmetal',st:'aktif',slot:'09:00',cnt:5,last:-28,step:28,today:['09:00','done'],fut:[28]},
 {n:'Dewi Lestari',ph:'0857-1020-3344',tx:'rem',st:'aktif',slot:'11:00',cnt:7,last:-14,step:14,today:['11:00','scheduled']},
 {n:'Andi Pratama',ph:'0821-7788-1200',tx:'ret',st:'retensi',slot:'13:00',cnt:4,last:-190,step:182,today:['13:00','missed']},
 {n:'Putri Ayu',ph:'0878-4455-6672',tx:'dq2c',st:'aktif',slot:'15:00',cnt:4,last:-42,step:42,today:['15:00','scheduled']},
 {n:'Rizky Ramadhan',ph:'0812-9090-1177',tx:'kclear',st:'aktif',slot:'09:30',cnt:6,last:-28,step:28,today:['09:30','done'],fut:[27]},
 {n:'Nadia Kusuma',ph:'0813-5566-2009',tx:'ndm',st:'aktif',slot:'14:00',cnt:5,last:-37,step:42},
 {n:'Fajar Nugroho',ph:'0857-3300-8841',tx:'dq2m',st:'aktif',slot:'08:30',cnt:5,last:-50,step:50,miss:[-92],ivx:[[-148,8,'week','Diperpanjang ke 8 minggu setelah ganti kawat']]},
 {n:'Hana Puspita',ph:'0821-6612-3478',tx:'rem',st:'aktif',slot:'16:00',cnt:4,last:-17,step:14,miss:[-10]},
 {n:'Yoga Prasetyo',ph:'0812-7001-5523',tx:'kmetal',st:'aktif',slot:'10:30',cnt:6,last:-37,step:30,miss:[-3]},
 {n:'Maya Anggraini',ph:'0878-9234-1160',tx:'ndc',st:'aktif',slot:'13:30',cnt:4,last:-58,step:44,miss:[-16,-100]},
 {n:'Dimas Aditya',ph:'0813-4400-2918',tx:'ret',st:'retensi',slot:'11:30',cnt:3,last:-150,step:182},
 {n:'Citra Wulandari',ph:'0857-2121-9087',tx:'dq2m',st:'aktif',slot:'14:30',cnt:8,last:-20,step:42,miss:[-125],fut:[22]},
 {n:'Eko Wijaya',ph:'0812-6677-0402',tx:'kmetal',st:'aktif',slot:'14:00',cnt:7,last:-26,step:28,fut:[2]},
 {n:'Rina Oktaviani',ph:'0821-3345-0099',tx:'kclear',st:'selesai',slot:'10:00',cnt:10,last:-150,step:28},
 {n:'Bagas Wicaksono',ph:'0813-8812-6650',tx:'kmetal',st:'aktif',slot:'09:30',cnt:4,last:-12,step:28,fut:[16],extra:[{off:-3,kind:'odon',status:'done',time:'11:00'}]},
 {n:'Fitri Handayani',ph:'0878-5050-1212',tx:'ndc',st:'aktif',slot:'11:30',cnt:3,last:-20,step:42,today:['14:00','scheduled','odon']},
 {n:'Tania Oktaviani',ph:'0812-8854-2096',tx:'kmetal',st:'aktif',slot:'16:00',cnt:3,last:-20,step:28,today:['16:00','scheduled','cabut']},
 {n:'Bella Safira',ph:'0821-4409-7765',tx:'dq2c',st:'konsultasi',consult:{off:-25,c:[-11]}},
 {n:'Kirana Putri',ph:'0857-6631-4412',tx:null,st:'konsultasi',consult:{off:-14,c:[]}},
 {n:'Ferry Hidayat',ph:'0812-1010-7733',tx:'kmetal',st:'konsultasi',consult:{off:-45,c:[-31,-17]}},
 {n:'Mutiara Sari',ph:'0813-9087-3321',tx:null,st:'konsultasi',consult:{off:-60,c:[-46,-32,-18]}},
 {n:'Joko Susilo',ph:'0812-7788-4521',tx:'kmetal',st:'batal',slot:'09:00',cnt:4,last:-90,step:28},
 {n:'Sinta Maharani',ph:'0878-3321-9904',tx:'dq2c',st:'batal',slot:'13:00',cnt:3,last:-120,step:42},
 {n:'Rendra Kusuma',ph:'0821-9012-6677',tx:null,st:'tidaklanjut',consult:{off:-80,c:[-66,-52,-38]}}];
function seed(){
  patients=[];guests=[];appts=[];apptN=1;TYPES=defTypes();
  const D=n=>noSun(T(n));
  const add=(pid,date,time,status,kind)=>appts.push({id:'a'+apptN++,pid,date,time,status,kind:kind||'kontrol'});
  SPEC.forEach((s,i)=>{
    const id='p'+(i+1);
    const p={id,name:s.n,phone:s.ph,tx:s.tx,status:s.st,slot:s.slot||'10:00',iv:[],start:null,consult:null};
    if(s.consult){p.consult={date:openDay(T(s.consult.off)),contacts:s.consult.c.map(o=>openDay(T(o)))};p.start=p.consult.date}
    if(s.cnt){
      const offs=[];for(let k=0;k<s.cnt;k++)offs.push(s.last-k*s.step-(k?((k*5)%3-1):0));
      offs.forEach(o=>add(id,D(o),p.slot,'done'));
      p.start=D(offs[offs.length-1]);
      const t=tx(s.tx);p.iv.push({date:p.start,v:t.v,u:t.u,note:'Disepakati saat konsultasi'});
      (s.ivx||[]).forEach(x=>p.iv.push({date:D(x[0]),v:x[1],u:x[2],note:x[3]}));
    }
    (s.miss||[]).forEach(o=>add(id,D(o),p.slot,'missed'));
    (s.fut||[]).forEach(o=>add(id,D(o),p.slot,'scheduled'));
    (s.extra||[]).forEach(x=>add(id,D(x.off),x.time,x.status,x.kind));
    if(s.today&&dow(TODAY)!==0)add(id,TODAY,s.today[0],s.today[1],s.today[2]);
    patients.push(p);
  });
  /* other clinic patients (not in Pasien list): real appointments so every calendar day has a proper list */
  const FN=['Rahmat','Sinta','Bagas','Dian','Fenny','Gilang','Hesti','Irfan','Jasmine','Kurnia','Laras','Maulana','Nurul','Okta','Putra','Qonita','Rizal','Salsa','Taufik','Utami','Vina','Wahyu','Yusuf','Zahra'];
  const LN=['Hidayat','Permana','Saputra','Utomo','Wibowo','Lestari','Nugraha','Pratiwi','Setiawan','Kurniawan','Fauzi','Rahayu','Halim'];
  guests=Array.from({length:72},(_,i)=>{const t=TYPES[i%8];return {id:'g'+(i+1),name:FN[i%24]+' '+LN[(i*5+(i/24|0)*3)%13],phone:'0812-'+pad2(30+i)+'00-'+String(1000+i*37).slice(-4),tx:t.id,status:'aktif',slot:'10:00',guest:true,
    iv:[{date:T(-120),v:t.v,u:t.u,note:'Disepakati saat konsultasi'}],start:T(-120),consult:null}});
  const sl=slotList(),order=ORDER.filter(t=>sl.includes(t)).concat(sl.filter(t=>!ORDER.includes(t)));let gi=0,busy=0;
  for(let o=-45;o<=75;o++){const d=T(o);if(dow(d)===0||d===TODAY)continue;
    const h=[...d].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7),w=dow(d),real=appts.filter(a=>a.date===d);
    let want=w===6?1+h%4:2+h%7;if(h%11===0)want=++busy%3===0?12:9+h%3;
    const used=new Set();real.forEach(a=>{if(a.time){used.add(a.time);if(apptMin(a)>30)used.add(hhmm(+a.time.slice(0,2)*60+ +a.time.slice(3)+30))}});
    order.filter(t=>!used.has(t)).slice(0,Math.max(0,want-real.length)).forEach((t,k)=>{
      add(guests[gi++%guests.length].id,d,t,o<0?((h+k)%9===0?'missed':'done'):'scheduled',(h+k)%13===0?'cabut':'kontrol')})}
}

/* ---------- persistence ---------- */
const LSK='milda-prototype-v3';
function save(){try{localStorage.setItem(LSK,JSON.stringify({day:TODAY,patients,guests,appts,apptN,TYPES,cfg:{clinic:S.clinic,template:S.template,callTemplate:S.callTemplate,fuTemplate:S.fuTemplate,hectingWeeks:S.hectingWeeks,rules:S.rules}}))}catch(e){}}
function load0(){
  try{const raw=localStorage.getItem(LSK);if(raw){const d=JSON.parse(raw);
    if(d&&d.day===TODAY&&d.patients&&d.appts&&d.guests){patients=d.patients;guests=d.guests;appts=d.appts;apptN=d.apptN;TYPES=d.TYPES;Object.assign(S,d.cfg);if(!S.callTemplate)S.callTemplate=DEF_CALL;return}}}catch(e){}
  seed();
}
function resetData(){try{localStorage.removeItem(LSK)}catch(e){}
  S.clinic=CLINIC;S.template=DEF_TPL;S.callTemplate=DEF_CALL;S.fuTemplate=DEF_FU;S.hectingWeeks=1;S.rules={days:[1,2,3,4,5,6],from:'09:00',to:'17:00',max:12,window:7,near:75};
  seed();save()}

/* ---------- domain rules ---------- */
const load=d=>appts.filter(a=>a.date===d&&a.status!=='cancelled').length;
const loadCls=f=>f<.5?'g':f<.75?'y':f<1?'o':'r';
const LOADS=[['g','Longgar'],['y','Cukup padat'],['o','Hampir penuh'],['r','Penuh']];
const loadLegend=note=>`<div class="hlegend" data-testid="load-legend">${LOADS.map(([k,l])=>`<span><i style="background:var(--ld-${k})"></i>${l}</span>`).join('')}${note?`<span>${note}</span>`:''}</div>`;
const bookedTimes=d=>new Set(appts.filter(a=>a.date===d&&a.time&&a.status!=='cancelled').map(a=>a.time));
const freeTimes=d=>{const b=bookedTimes(d);return slotList().filter(t=>!b.has(t))};
const pat=id=>patients.find(p=>p.id===id)||guests.find(p=>p.id===id);
const curIv=p=>{let best=null;p.iv.forEach(r=>{if(!best||r.date>=best.date)best=r});return best};
const pApps=id=>appts.filter(a=>a.pid===id);
const isAct=p=>p.status==='aktif'||p.status==='retensi';
const lastDone=p=>pApps(p.id).filter(a=>a.status==='done'&&a.kind==='kontrol').map(a=>a.date).sort().pop()||null;
const baseDate=p=>lastDone(p)||p.start;
const dueDate=p=>{const i=curIv(p);return i?addInterval(baseDate(p),i.v,i.u):null};
const byTime=(a,b)=>(a.date+(a.time||'99:99')).localeCompare(b.date+(b.time||'99:99'));
const nextAppt=p=>pApps(p.id).filter(a=>a.status==='scheduled'&&a.date>=TODAY).sort(byTime)[0]||null;
const nextControl=p=>pApps(p.id).filter(a=>a.status==='scheduled'&&a.kind==='kontrol'&&a.date>=TODAY).sort(byTime)[0]||null;
const missedCount=p=>pApps(p.id).filter(a=>a.status==='missed'&&a.kind==='kontrol').length;
const apptMin=a=>a.kind==='kontrol'?(tx(pat(a.pid).tx)||{min:30}).min:KMIN[a.kind];
function pendingHecting(p){
  const od=pApps(p.id).filter(a=>a.kind==='odon'&&a.status==='done').sort(byTime).pop();
  if(!od)return null;
  if(pApps(p.id).some(a=>a.kind==='hecting'&&a.status!=='cancelled'&&a.date>=od.date))return null;
  return {k:'hecting',p,due:addDays(od.date,7*S.hectingWeeks),odon:od};
}
const fuCount=p=>p.consult?p.consult.contacts.length:0;
const fuDue=p=>{const c=p.consult;const last=c.contacts.length?c.contacts[c.contacts.length-1]:c.date;return openDay(addDays(last,FU_DAYS))};
function recall(){
  const kon=patients.filter(p=>isAct(p)&&!nextControl(p)&&curIv(p)).map(p=>({k:'kontrol',p,due:dueDate(p)}));
  const hec=patients.filter(isAct).map(pendingHecting).filter(Boolean);
  const all=kon.concat(hec).sort((a,b)=>a.due.localeCompare(b.due));
  const week=all.filter(r=>r.due>=TODAY&&r.due<=addDays(TODAY,7));
  const over=all.filter(r=>r.due<TODAY);
  const fu=patients.filter(p=>p.status==='konsultasi'&&p.consult).map(p=>({k:'fu',p,due:fuDue(p)})).filter(r=>r.due<=addDays(TODAY,7)||fuCount(r.p)>=FU_MAX).sort((a,b)=>a.due.localeCompare(b.due));
  const none=all.filter(r=>r.due>addDays(TODAY,7));
  return {week,over,none,fu};
}
const normPhone=s=>{let d=s.replace(/[\s-]/g,'');if(d.startsWith('+'))d=d.slice(1);if(d.startsWith('0'))d='62'+d.slice(1);return d};
const fillTpl=(tpl,p,date,time)=>{if(!time)tpl=tpl.replace(/\s*(pukul|pada jam|jam|pk\.?)\s*\{jam\}/gi,'').replace(/\s*\{jam\}/g,'').replace(/\s+([.,;!?])/g,'$1');
  return tpl.replace(/\{nama\}/g,p.name).replace(/\{klinik\}/g,S.clinic).replace(/\{tanggal\}/g,date?fmtId(date):'').replace(/\{jam\}/g,time||'')};
const waHref=(p,msg)=>`https://wa.me/${normPhone(p.phone)}?text=${encodeURIComponent(msg)}`;
/* which WhatsApp template applies: upcoming visit -> reminder with its real date/time; none -> ajakan kontrol with due date; konsultasi -> follow-up */
const WAT={reminder:'Pengingat jadwal kontrol',call:'Ajakan kontrol',fu:'Follow-up konsultasi'};
function waPlan(p,kind){
  if(kind==='fu')return {t:'fu',text:fillTpl(S.fuTemplate,p)};
  const a=nextAppt(p);
  if(a)return {t:'reminder',text:fillTpl(S.template,p,a.date,a.time)};
  const ph=pendingHecting(p),due=(ph&&ph.due)||dueDate(p)||TODAY;
  return {t:'call',text:fillTpl(S.callTemplate,p,due)};
}
const dispPhone=p=>{const n=normPhone(p).replace(/^62/,'');return '+62 '+n.replace(/^(\d{3})(\d{4})(\d+)$/,'$1 $2 $3')};
const waBtn=(p,kind,tid,sm)=>`<button class="btn wa ${sm?'sm':''}" data-act="wa" data-id="${p.id}" data-kind="${kind}" data-testid="${tid}">${ic('chat')}WhatsApp</button>`;
function dueState(due){
  const d=diff(due,TODAY);
  if(d<0)return{cls:'st-late',text:`Terlambat ${-d} hari`};
  if(d===0)return{cls:'st-soon',text:'Jatuh tempo hari ini'};
  return{cls:d<=7?'st-soon':'',text:`Dalam ${d} hari`};
}

/* ---------- icons ---------- */

/* Archwire timeline. items: [{k:'done'|'missed'|'next'|'due', label, sub?}], W = pixel width */
function wireSvg(items,W,spx){
  const n=items.length,padL=40,H=164,x0=8,x1=W-8,yL=104,yM=104,yR=38;
  const yAt=x=>{const t=(x-x0)/(x1-x0);return (1-t)*(1-t)*yL+2*t*(1-t)*yM+t*t*yR};
  const slope=x=>{const t=(x-x0)/(x1-x0);return (2*(1-t)*(yM-yL)+2*t*(yR-yM))/(x1-x0)};
  const sp=spx||(n>1?Math.min(240,(W-padL-60)/(n-1)):0),SLOT='<path d="M-14 0H14" stroke="#C9C9C9" stroke-width="3" stroke-linecap="round"/>';
  let g='';
  items.forEach((it,i)=>{
    const x=padL+i*sp,y=yAt(x),ang=Math.atan(slope(x))*180/Math.PI;
    const tf=`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang.toFixed(1)})`;
    let r='';
    if(it.k==='done')r=`<rect x="-10" y="-10" width="20" height="20" rx="5" fill="#7A5C3A"/>${SLOT}`;
    else if(it.k==='missed')r=`<rect x="-9" y="-9" width="18" height="18" rx="5" fill="#fff" stroke="#9C3F2A" stroke-width="2.2"/>${SLOT}`;
    else if(it.k==='next')r=`<rect x="-10" y="-10" width="20" height="20" rx="5" fill="#fff" stroke="#B89878" stroke-width="2.5"/>${SLOT}`;
    else r=`<rect x="-10" y="-10" width="20" height="20" rx="5" fill="#fff" stroke="#B89878" stroke-width="2.2" stroke-dasharray="4 3.5"/>${SLOT}`;
    const cls=it.k==='next'?'hl':it.k==='missed'?'bad':it.k==='due'?'due':'';
    const ly=y+36;
    g+=`<g transform="${tf}">${r}</g>`;
    if(it.sub)g+=`<text x="${x.toFixed(1)}" y="${(ly).toFixed(1)}" text-anchor="middle" class="${cls}">${it.sub}</text><text x="${x.toFixed(1)}" y="${(ly+17).toFixed(1)}" text-anchor="middle" class="${cls}">${it.label}</text>`;
    else g+=`<text x="${x.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" class="${cls}">${it.label}</text>`;
  });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Riwayat kunjungan kontrol"><path d="M${x0} ${yL} Q ${(W/2).toFixed(1)} ${yM} ${x1} ${yR}" fill="none" stroke="#C9C9C9" stroke-width="2" stroke-linecap="round"/>${g}</svg>`;
}
function wireLegend(){
  const b=(t,fill,stroke,dash)=>`<svg viewBox="-12 -8 24 16" aria-hidden="true"><rect x="-6" y="-6" width="12" height="12" rx="3.5" fill="${fill}" ${stroke?`stroke="${stroke}" stroke-width="1.8"`:''} ${dash?'stroke-dasharray="3 2.5"':''}/><path d="M-11 0H11" stroke="#C9C9C9" stroke-width="2.4" stroke-linecap="round"/></svg>${t}`;
  return `<div class="wlegend"><span>${b('Selesai','#7A5C3A')}</span><span>${b('Tidak datang','#fff','#9C3F2A')}</span><span>${b('Terjadwal','#fff','#B89878')}</span><span>${b('Jatuh tempo, belum dijadwalkan','#fff','#B89878',true)}</span></div>`;
}

function patientWireItems(p){
  const items=[];
  pApps(p.id).filter(a=>a.kind==='kontrol'&&a.status!=='cancelled').sort(byTime).forEach(a=>{
    if(a.status==='done')items.push({k:'done',label:fmtS(a.date)});
    else if(a.status==='missed')items.push({k:'missed',label:fmtS(a.date)});
    else if(a.date>=TODAY)items.push({k:'next',label:fmtS(a.date)});
  });
  if(isAct(p)&&!nextControl(p)&&curIv(p))items.push({k:'due',sub:'Jatuh tempo',label:fmtS(dueDate(p))});
  return items;
}
function drawWires(){
  document.querySelectorAll('[data-wire]').forEach(el=>{
    const p=pat(el.dataset.wire);if(!p)return;
    const items=patientWireItems(p),n=items.length,cw=el.clientWidth||600,SP=84;
    if(n<2||40+(n-1)*SP+70<=cw){el.innerHTML=wireSvg(items,cw);return}
    /* scrolls to the end, aligned so the first visible bracket (and its label) sits 24px from the left edge, never clipped */
    const k=Math.ceil(((n-1)*SP+64-cw)/SP),W=cw+16+k*SP;
    el.innerHTML=wireSvg(items,W,SP);el.scrollLeft=W-cw;
  });
}

/* ---------- QR (static, plausible, not scannable) ---------- */
function qrSvg(){
  const N=29,g=Array.from({length:N},()=>Array(N).fill(0));let seed=20261020;
  const rnd=()=>(seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)g[y][x]=rnd()>0.52?1:0;
  const box=(x0,y0,w,h,v)=>{for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)if(y>=0&&y<N&&x>=0&&x<N)g[y][x]=v};
  const finder=(x0,y0)=>{box(x0-1,y0-1,9,9,0);box(x0,y0,7,7,1);box(x0+1,y0+1,5,5,0);box(x0+2,y0+2,3,3,1)};
  finder(0,0);finder(N-7,0);finder(0,N-7);
  for(let i=8;i<N-8;i++){g[6][i]=i%2?0:1;g[i][6]=i%2?0:1}
  let d='';for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(g[y][x])d+=`M${x} ${y}h1v1h-1z`;
  return `<svg viewBox="-1 -1 ${N+2} ${N+2}" shape-rendering="crispEdges" role="img" aria-label="Kode QR contoh"><path d="${d}" fill="#2B2420"/></svg>`;
}

  const parts=['status','tx'].filter(g=>S[FK[g]]).map(g=>{const sel=S[FK[g]],names=AFDEF[g]().filter(x=>sel.includes(x[0])).map(x=>x[1]);
    const t=names.length>2?names.length+' dipilih':names.join(', ')||'Tidak ada';
    return `<span class="fc" data-testid="chip-${g}">${AFT[g]}: ${esc(t)}<button data-act="afclear" data-id="${g}" aria-label="Hapus filter ${AFT[g]}">&times;</button></span>`}).join('');
  return `<div class="pchips"><div class="fcs">${parts}</div>${(S.pq.trim()||S.fStatus||S.fTx)?`<span class="sub" data-testid="pcount">Menampilkan ${n} dari ${patients.length} pasien</span>`:''}</div>`;
}
function patientList(){

function viewPatient(id){

  const facts=kon?`<div><div class="k">Tanggal konsultasi</div><div class="v">${fmtSY(p.consult.date)}</div></div>

    <div><div class="k">Periode kontrol</div><div class="v" data-testid="current-interval">${i?ivTxt(i.v,i.u):'-'}</div>${i&&act?`<button class="lnk" data-act="chiv" data-id="${p.id}" data-testid="change-interval">Ubah periode</button>`:''}</div>
    <div><div class="k">Mulai</div><div class="v">${p.start?fmtSY(p.start):'-'}</div></div>
    <div><div class="k">Jatuh tempo</div><div class="v" data-testid="next-due">${act&&due?fmtSY(due):'-'}<small>${dueSub}</small></div></div>
    <div><div class="k">Tidak datang</div><div class="v">${missedCount(p)} kali</div></div>
    <div><div class="k">Kontrol terakhir</div><div class="v">${lastDone(p)?fmtSY(lastDone(p)):'-'}<small>${pApps(p.id).filter(a=>a.kind==='kontrol'&&a.status==='done').length} kontrol selesai</small></div></div>`;
  const acts=`${waBtn(p,kon?'fu':'reminder','wa-'+p.id)}${kon?`<button class="btn ${stillK?'primary':''}" data-act="start" data-id="${p.id}" data-testid="start-${p.id}">Mulai perawatan</button>`:act?(nx?`<button class="btn primary" data-act="apptresch" data-id="${nx.id}" data-testid="resched-${p.id}">Ubah jadwal</button>`:`<button class="btn primary" data-act="book" data-id="${p.id}" data-testid="book-${p.id}">Buat jadwal</button>`):''}<button class="btn" data-act="status" data-id="${p.id}" data-testid="change-status">Ubah status</button>`;

/* calendar */
const HH=46;
const short=n=>{const w=n.split(' ');return w.length>1?w[0]+' '+w[1][0]+'.':n};
const dayLines=d=>appts.filter(a=>a.date===d&&a.status!=='cancelled').sort(byTime).map(a=>({t:a.time,name:short(pat(a.pid).name),aid:a.id}));
function monthGrid(){
  const m0=S.calMonth,mEnd=addDays(addMonths(m0,1),-1),start=weekStart(m0),end=addDays(weekStart(mEnd),6);
  let rows='';
  for(let ws=start;ws<=end;ws=addDays(ws,7)){
    let tds='';
    for(let k=0;k<7;k++){const d=addDays(ws,k),dn=P(d).getUTCDate();
      if(k===6){tds+=`<td class="sun"><div class="dh"><span class="dn">${dn}</span><span class="dlz">Tutup</span></div></td>`;continue}
      if(d.slice(0,7)!==m0.slice(0,7)){tds+=`<td class="out"><div class="dh"><span class="dn">${dn}</span></div></td>`;continue}
      const n=load(d),cls=d<TODAY?'past':loadCls(n/S.rules.max),L=dayLines(d);
      tds+=`<td class="${cls} ${d===TODAY?'today':''}" data-testid="mday-${d}"><div class="dh"><span class="dn">${dn}</span>${n?`<span class="dlz">${n}/${S.rules.max}</span>`:''}</div>${L.slice(0,3).map(l=>`<span class="ln ${l.aid?'lk':''}" ${l.aid?`role="button" tabindex="0" data-act="appt" data-id="${l.aid}"`:''}><b>${l.t||'--:--'}</b>${l.name}</span>`).join('')}${L.length>3?`<button class="more" data-act="cweek" data-id="${d}">+${L.length-3} lagi</button>`:''}</td>`}
    rows+=`<tr>${tds}</tr>`}
  return `<table class="mg" data-testid="cal-month"><thead><tr>${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
}
function weekCol(d,wk){
  const real=wk.filter(a=>a.date===d&&a.time);
  const byT={};real.forEach(a=>{(byT[a.time]=byT[a.time]||[]).push(a)});
  let out='';
  Object.keys(byT).forEach(t=>{const L=byT[t];L.forEach((a,k)=>{
    const p=pat(a.pid),[hh,mm]=t.split(':').map(Number),top=((hh*60+mm)-480)/60*HH,w=100/L.length,cls=`blk ${a.status==='scheduled'&&a.kind!=='kontrol'?'kind':a.status}`;
    out+=`<div class="${cls}" style="top:${top}px;height:${Math.max(apptMin(a)/60*HH-2,22)}px;left:calc(${k*w}% + 2px);width:calc(${w}% - 4px)" data-act="appt" data-id="${a.id}" data-testid="blk-${p.id}" title="${t} ${esc(p.name)}, ${a.kind==='kontrol'?typeName(p):KIND[a.kind]}" role="button" tabindex="0" aria-label="${t} ${esc(p.name)}, ${a.kind==='kontrol'?typeName(p):KIND[a.kind]}, ${AST[a.status][0]}"><b>${t}</b>${esc(short(p.name))}</div>`})});
  return `<div class="col ${d===TODAY?'today':''}">${out}</div>`;
}
const LEGNOTE=()=>`Angka ${Math.min(6,S.rules.max)}/${S.rules.max} artinya ${Math.min(6,S.rules.max)} jadwal dari maksimal ${S.rules.max} per hari`;
function viewCalendar(){
  const mo=S.calMode==='month',ws=S.calWeek,days=[0,1,2,3,4,5].map(n=>addDays(ws,n));
  const wk=appts.filter(a=>a.date>=days[0]&&a.date<=days[5]&&a.status!=='cancelled').sort(byTime);
  const rng=`${P(days[0]).getUTCDate()} ${MON[P(days[0]).getUTCMonth()]} sampai ${P(days[5]).getUTCDate()} ${MON[P(days[5]).getUTCMonth()]} ${P(days[5]).getUTCFullYear()}`;
  const mtitle=`${ID_MON[P(S.calMonth).getUTCMonth()]} ${P(S.calMonth).getUTCFullYear()}`;
  const hrs=[];for(let h=8;h<=17;h++)hrs.push(`<div>${pad2(h)}:00</div>`);
  const week=`<div data-testid="cal-grid"><div class="calh"><div></div>${days.map(d=>`<div class="${d===TODAY?'today':''}" data-testid="cal-head-${d}">${DOWS[dow(d)]}<b>${P(d).getUTCDate()}</b>${loadChip(d)}</div>`).join('')}</div><div class="calb"><div class="hours">${hrs.join('')}</div>${days.map(d=>weekCol(d,wk)).join('')}</div></div>`;
  const bar=`<div class="calbar"><button class="btn ic" data-act="cprev" data-testid="cal-prev" aria-label="Sebelumnya">${ic('prev')}</button><button class="btn ic" data-act="cnext" data-testid="cal-next" aria-label="Berikutnya">${ic('next')}</button><button class="btn" data-act="ctoday" data-testid="cal-today">Hari ini</button><h2 data-testid="cal-range">${mo?mtitle:rng}</h2><span class="sp"></span>${mo?`<button class="btn xl" data-act="export" data-id="calendar" data-testid="export-calendar">Export Excel</button>`:''}
   <div class="seg" style="min-width:200px" role="group" aria-label="Tampilan kalender"><button aria-pressed="${!mo}" class="${mo?'':'on'}" data-act="cmode" data-id="week" data-testid="cal-tab-week">Minggu</button><button aria-pressed="${mo}" class="${mo?'on':''}" data-act="cmode" data-id="month" data-testid="cal-tab-month">Bulan</button></div></div>`;
  const list=`<div class="only-m"><div class="calbar-m"><button class="btn ic" data-act="cprev" data-testid="cal-prev-m" aria-label="Sebelumnya">${ic('prev')}</button><button class="btn ic" data-act="cnext" data-testid="cal-next-m" aria-label="Berikutnya">${ic('next')}</button><button class="btn" data-act="ctoday" data-testid="cal-today-m">Hari ini</button><h2>${rng}</h2></div><div style="margin:-2px 0 16px">${loadLegend(LEGNOTE())}</div>${days.map(d=>{const L=wk.filter(a=>a.date===d),all=S.calOpen[d],vis=all?L:L.slice(0,6);return `<div class="daysec"><h3>${fmtId(d).replace(/ \d{4}$/,'')}${d===TODAY?chip('tag','Hari ini'):''}${loadChip(d)}</h3>${L.length?`<div class="ledger">${vis.map(a=>{const p=pat(a.pid);return `<div class="lr hrow" role="button" tabindex="0" data-act="appt" data-id="${a.id}" style="cursor:pointer"><b>${a.time||'--:--'}</b><div><div class="nm">${esc(p.name)}</div><div class="sub">${a.kind==='kontrol'?typeName(p):KIND[a.kind]}</div></div>${aChip(a)}</div>`}).join('')}</div>${L.length>vis.length?`<button class="btn sm" style="margin-top:8px;width:100%" data-act="cexp" data-id="${d}">Tampilkan ${L.length-vis.length} jadwal lagi</button>`:''}`:`<div class="ledger"><div class="empty slim">Tidak ada jadwal</div></div>`}</div>`}).join('')}</div>`;
  return `<header class="ph"><h1 class="title only-d">Kalender</h1><p class="sub">Klinik tutup hari Minggu</p></header>
  <div class="calcard only-d">${bar}<div class="calleg">${loadLegend(LEGNOTE())}</div>${mo?monthGrid():week}</div>${list}`;
}

function suggest(anchor,excl){
  const R=S.rules,out=[];
  for(let k=-R.window;k<=R.window;k++){const d=addDays(anchor,k);
    if(d<=TODAY||d===excl||!R.days.includes(dow(d)))continue;
    const f=load(d)/R.max;if(f>=R.near/100)continue;
    out.push({d,k,n:load(d),f,score:Math.abs(k)+f*5})}
  return out.sort((a,b)=>a.score-b.score||a.k-b.k).slice(0,3);
}

}

 appt:id=>openAppt(id),apptresch:id=>{closeModal();openReschedule(id)},
 apptpat(id){closeModal();location.hash='#patient/'+id},
 apptcancel(id){const a=appts.find(x=>x.id===id);a.status='cancelled';closeModal();rerender();toast('Kunjungan dibatalkan',()=>{a.status='scheduled';rerender()})},
 sug(id){bk.sel=id;if(bk.mode==='set')pickTime();renderBooking()},
 hday(id){bk.sel=id;if(bk.mode==='set')pickTime();renderBooking()},
 tmode(id){bk.mode=id;if(id==='set')pickTime();renderBooking()},
 tchip(id){bk.time=id;renderBooking()},
 reason(id){bk.reason=+id;renderBooking()},
 qchip(id,e,t){$('#iv-value').value=t.dataset.v;$('#iv-unit').value=t.dataset.u;syncChips()},
 rday(id){const n=+id,d=S.rules.days;S.rules.days=d.includes(n)?d.filter(x=>x!==n):d.concat(n);rerender()},
 ivsave(pid){
  const v=parseInt($('#iv-value').value,10),u=$('#iv-unit').value,date=$('#iv-date').value||TODAY,note=$('#iv-note').value.trim();
  if(!(v>=1))return;
  pat(pid).iv.push({date,v,u,note});closeModal();rerender();toast(`Periode kontrol diperbarui: ${ivTxt(v,u)}`)},
 npsave(){
  const name=$('#np-name').value.trim(),ph=$('#np-phone').value.trim(),st=$('#np-status').value,n=normPhone(ph);
  const err=(m,f)=>{$('#np-err').textContent=m;document.querySelectorAll('#mb [aria-invalid]').forEach(x=>x.removeAttribute('aria-invalid'));const el=$(f);el.setAttribute('aria-invalid','true');el.focus()};
  if(!name)return err('Nama wajib diisi.','#np-name');
  if(!/^62\d{8,13}$/.test(n))return err('Masukkan nomor WhatsApp yang valid, contoh 0812-3456-7890.','#np-phone');
  const id='p'+(patients.length+1+Math.floor(Math.random()*1000));
  if(st==='konsultasi'){
    const cd=$('#np-cdate').value||TODAY,tid=$('#np-ctype').value||null;
    patients.push({id,name,phone:ph,tx:tid,status:'konsultasi',start:cd,slot:'10:00',iv:[],consult:{date:cd,contacts:[]}});
  }else{
    const v=parseInt($('#np-v').value,10),type=$('#np-type').value,start=$('#np-start').value||TODAY;
    if(!(v>=1))return err('Periode kontrol minimal 1.','#np-v');
    patients.push({id,name,phone:ph,tx:type,status:type==='ret'?'retensi':'aktif',start,slot:'10:00',iv:[{date:start,v,u:$('#np-u').value,note:'Bawaan untuk '+tx(type).name}],consult:null});
  }
  S.pq='';closeModal();rerender();toast(`Pasien ditambahkan: ${name}`)},
};
function refreshPlist(){const el=$('#pwrap');if(el)keepFocus(el,()=>{el.innerHTML=patientBlock()});const l=$('#fbl');if(l)l.textContent=fcount()?'Filter ('+fcount()+')':'Filter'}
function closePop(ret){const was=S.af;S.af=null;const r=$('#pop-root');if(r)r.innerHTML='';if(was){const b=document.querySelector(`[data-testid="af-${was}"]`);if(b){b.setAttribute('aria-expanded','false');if(ret)b.focus({preventScroll:true})}}}
function applyFilter(box){
  const g=box.dataset.afc,all=[...box.querySelectorAll('[data-afi]')],chk=all.filter(x=>x.checked).map(x=>x.dataset.afi);
  S[FK[g]]=chk.length===all.length?null:chk;
  box.querySelector('[data-afall]').checked=!S[FK[g]];
  refreshPlist();
}
document.addEventListener('click',e=>{
  if(S.af&&!e.target.closest('.pop')&&!e.target.closest('.fb'))closePop();
  const t=e.target.closest('[data-act]');
  if(t){const f=A[t.dataset.act];if(f){f(t.dataset.id,e,t);return}}
});
const prevTpl=()=>{const el=$('#tpl-preview');if(el)el.textContent=fillTpl(S.template,pat('p1'),nextOpen(TODAY),'10:00');const c=$('#call-preview');if(c)c.textContent=fillTpl(S.callTemplate,pat('p1'),openDay(T(3)));const f=$('#fu-preview');if(f)f.textContent=fillTpl(S.fuTemplate,pat('p20'))};
document.addEventListener('input',e=>{
  const id=e.target.id,d=e.target.dataset;
  if(id==='patient-search'){S.pq=e.target.value;refreshPlist()}
  else if(id==='wa-template'){S.template=e.target.value;prevTpl();save()}
  else if(id==='call-template'){S.callTemplate=e.target.value;prevTpl();save()}
  else if(id==='fu-template'){S.fuTemplate=e.target.value;prevTpl();save()}
  else if(id==='clinic-name'){S.clinic=e.target.value||CLINIC;prevTpl();save()}
  else if(id==='rs-note'){bk.note=e.target.value}
  else if(id==='rule-max'){const v=parseInt(e.target.value,10);if(v>=1)S.rules.max=v;save()}
  else if(id==='rule-window'){const v=parseInt(e.target.value,10);if(v>=0)S.rules.window=v;save()}
  else if(id==='hecting-weeks'){const v=parseInt(e.target.value,10);if(v>=1)S.hectingWeeks=v;save()}
  else if(id==='rule-from'||id==='rule-to'){if(/^\d\d:\d\d$/.test(e.target.value)){S.rules[id==='rule-from'?'from':'to']=e.target.value;save()}}
  else if(id==='iv-value')syncChips();
  else if(d.tv){const t=tx(d.tv),v=parseInt(e.target.value,10);if(t&&v>=1){t.v=v;save()}}
});
document.addEventListener('change',e=>{
  const id=e.target.id,d=e.target.dataset;
  if(id==='iv-unit')syncChips();
  else if(id==='f-sort'){const [k,dd]=e.target.value.split(':');S.sort={k,d:+dd};refreshPlist()}
  else if(e.target.dataset.afall!==undefined){const box=e.target.closest('[data-afc]');box.querySelectorAll('[data-afi]').forEach(x=>x.checked=e.target.checked);applyFilter(box)}
  else if(e.target.dataset.afi!==undefined){applyFilter(e.target.closest('[data-afc]'))}
  else if(id==='np-type'||id==='st-type'){const t=tx(e.target.value),k=id==='np-type'?'np':'st';if(t){$('#'+k+'-v').value=t.v;$('#'+k+'-u').value=t.u}}
  else if(id==='np-status'){const kon=e.target.value==='konsultasi';$('#np-kon').hidden=!kon;$('#np-act').hidden=kon}
  else if(d.tu){const t=tx(d.tu);if(t){t.u=e.target.value;save()}}
});
document.addEventListener('keydown',e=>{
  if((location.hash==='#login'||!location.hash)&&!e.target.closest('input,textarea,select')){if(/^\d$/.test(e.key))pressKey(e.key);else if(e.key==='Backspace')pressKey('b')}
  if(e.key==='Escape'){if($('#modal-root .modal'))closeModal();else closePop(true)}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}
  if(e.key==='Tab'&&$('#modal-root .modal')){const m=$('#modal-root .modal'),f=[...m.querySelectorAll(FOCUSABLE)].filter(x=>x.offsetParent!==null);
    if(f.length){const a=f[0],z=f[f.length-1],ae=document.activeElement;if(e.shiftKey&&(ae===a||ae===m)){e.preventDefault();z.focus()}else if(!e.shiftKey&&ae===z){e.preventDefault();a.focus()}}}
  const tab=e.target.closest&&e.target.closest('[role=tab]');
  if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){const L=[...tab.parentElement.querySelectorAll('[role=tab]')],i=L.indexOf(tab),j=e.key==='Home'?0:e.key==='End'?L.length-1:(i+(e.key==='ArrowRight'?1:-1)+L.length)%L.length;
    e.preventDefault();const id=L[j].dataset.testid;L[j].click();const n=document.querySelector(`[data-testid="${id}"]`);n&&n.focus()}
});
document.addEventListener('focusout',e=>{if(S.af){const p=$('#pop-root .pop'),n=e.relatedTarget;if(p&&n&&!p.contains(n)&&!(n.closest&&n.closest('.fb')))closePop()}});
window.addEventListener('scroll',()=>{if(S.af)closePop()},{passive:true});
window.addEventListener('resize',()=>{if(document.querySelector('[data-wire]'))drawWires()});
window.addEventListener('hashchange',route);
route();

</script>
</body>
</html>
